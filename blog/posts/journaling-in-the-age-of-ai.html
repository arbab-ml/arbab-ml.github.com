        <script type="text/markdown" id="markdown-source">
**Journaling is a good way to reflect on your thoughts.** It's like the ultimate backpropagation for us humans. I remember a "null entry" from 2016 on a stressful day. I had an exam and was close to getting dropped out of college. I was trying an app called Penzo. Every year, I'd get an email reminding me of what I wrote on that day. This was great, but it made me wonder why I didn't keep using the app.

For the last two years, I switched to a Google Doc. But there was still a lot of friction when I tried to write. So, the frequency dropped to about once or twice a month.

**Recently, things changed with Large Language Models (LLMs).** They can take all your thoughts, incidents, setbacks, and successes. They can put everything together and try to give you advice. This is extremely invaluable and, I believe, beyond the power of any therapist.

The most important piece of the puzzle left to solve is not the technology. I believe that bit is mostly resolved with how good LLMs are now. The bigger bottleneck is the data. For us humans, this means data of our daily occurrences, our past, our failures, our triggers, and traumas. That is the missing piece. With this data, you can unleash the massive power of LLMs to find blind spots or brainstorm. It's the closest ally one can get, processing thoughts we only have to ourselves in seconds, and on a scale of terabytes.

**Because of this, I decided to journal as much as I can.** I'm creating a setup that I find helpful. All the apps I tried overcomplicate things. I wanted a clean setup that I could edit myself. I also wanted to instantaneously document something if it comes to my mind. That's how you can capture your true shifts in moods.

**Currently, my setup involves pressing a physical button on my iPhone.** It listens to me until I press the button again. That audio is saved as plain text, time-stamped with my other journal entries.

I ended up creating an Apple Shortcut. It listens and appends the text directly to the end of my notes. This way, I have the text. I have full control to move, copy, and paste. I also have the flexibility to add any entry conveniently, at any point in time, with minimum friction.
